[project]
name = "solobuildai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.2",
    "arq>=0.26.0",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "docx>=0.2.4",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.23.0",
    "openai>=3.13.0",
    "pgvector>=0.5.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.18.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-magic-bin>=0.4.14",
    "redis[hiredis]>=5.0.0",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
